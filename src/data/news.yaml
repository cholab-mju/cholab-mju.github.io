- date: 2026-03
  title: 여대학원생 공학연구팀제 지원사업 선정
  body:
  - 2026년 여대학원생 공학연구팀제 지원사업에 우리 연구실 연구팀이 최종 선정되었습니다. 연구책임자인 손예빈 석사과정을 비롯해 참여 연구자인 서예원, 최성훈, 정서진 학생의 좋은 연구를 기대합니다. 축하합니다!🎉
- date: 2025-12
  title: 이수진 학생, 국가우수 장학생 선발
  body:
  - 이수진 학생이 국가우수장학금(이공계) 장학생으로 선발되었습니다. 이에 부총리 겸 과학기술정보통신부 장관 명의의 장학증서와 메달을 수여받았으며, 연간 500만 원의 장학금을 지원받게 되었습니다. 축하합니다!🎉

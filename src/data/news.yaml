  title: 김지혜, 권영은 학생, 환경독성·보건 아이디어 공모전 환경부장관상 수상
  body:
  - 김지혜 학생과 권영은 학생이 지난 11월 26일 개최된 ‘2025 환경독성·보건 분야 과학소통 아이디어 공모전’에서 대학원생 부문 금상인 환경부 장관상을 수상하였습니다. 두 학생의 뛰어난 아이디어와 우수한 성과가 높이 평가된 뜻깊은 결과입니다. 축하합니다!🎉

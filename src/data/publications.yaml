# 논문 목록. num이 큰 순서(최신)로 표시됩니다. 새 논문은 num을 하나 올려 맨 위에 추가하세요.
# insight: 각 논문의 요약(summary)과 의의(importance)를 한국어(ko)와 영어(en)로 적습니다. 비워 두면 Insight 버튼이 표시되지 않습니다.
- num: 23
  title: Oleic Acid-Mediated Double Emulsification Enables Enhanced Aqueous Stability and Localized Photothermal Heating of Liquid Metal Droplets
  authors: Eunju Na, Youngwon Kim, Jihye Kim, Sang Kug Chung, Yongmin Cho†, Bongseop Kwak†, Joohyung Lee†
  venue: Small Methods
  year: 2026
  detail: 10(19), e71023
  url: https://doi.org/10.1002/smtd.71023
  insight:
    ko:
      summary: 갈륨 기반 액체금속(EGaIn) 나노액적을 올레산 중간상 안에 가두고 이를 다시 물에 유화시켜, 액체금속이 물과 직접 닿지 않는 '액체금속/올레산/물' 이중 에멀전(요크-쉘) 구조를 만든 연구입니다. 복잡한 표면 개질 없이 젖음성 차이만으로 구조가 저절로 형성되며, 올레산 층이 물의 침투를 막는 동시에 단열 미세환경으로 작용해 수중 안정성과 근적외선 광열 성능이 기존 분산액보다 향상되었습니다.
      importance: 물속에서 쉽게 산화·가수분해되는 액체금속의 고질적인 약점을 단순한 공정으로 해결한 점이 핵심입니다. 급성 독성이 낮고 3차원 종양 스페로이드의 광열 억제 효과를 보였으며 다른 기능성 성분을 쉽게 추가할 수 있어, 광열 치료와 같은 생체 응용 플랫폼으로 확장될 가능성이 있습니다. 다만 동물 수준의 치료 효능 검증은 이 논문의 범위를 넘어섭니다.
    en:
      summary: Gallium-based liquid-metal (EGaIn) nanodroplets were confined in an oleic-acid phase that was then emulsified in water, spontaneously forming a yolk–shell liquid-metal-in-oil-in-water double emulsion driven only by wettability, with no surface modification. The oleic-acid layer blocks water transport and acts as a thermally insulating microenvironment, giving better aqueous stability and stronger near-infrared photothermal heating than conventional liquid-metal dispersions.
      importance: It addresses the long-standing weakness of liquid metals, oxidation and hydrolysis in water, with a simple and potentially scalable process. The platform showed low acute toxicity, photothermal suppression of 3D tumor spheroids and easy loading of extra functional components, pointing toward biomedical photothermal applications; in vivo therapeutic efficacy was not part of this study.
- num: 22
  title: A Caenorhabditis elegans-based whole-organism microfluidic biosensing platform for detecting lung cancer cell-derived volatile organic compounds
  authors: Nari Jang, Seung Hwan Lee, Yongmin Cho†, Shin Sik Choi†
  venue: Biotechnology and Bioprocess Engineering
  year: 2026
  detail: 31(5), 867-876
  url: https://doi.org/10.1007/s12257-026-00309-y
  insight:
    ko:
      summary: 폐암 세포가 내놓는 휘발성 유기화합물(VOC)을 예쁜꼬마선충의 후각 행동으로 감지하는 전(全)개체 기반 미세유체 바이오센싱 플랫폼을 개발했습니다. 표준 NGM 배지 위에서 작동하는 PDMS 칩으로 대조 배지와 시험 시료를 짝지어 비교하도록 설계했으며, 야생형 선충은 폐암세포(SK-MES-1) 배양액을 정상 폐섬유아세포 배양액이나 배지 대조군과 구별해 10⁻³~10⁻⁷ 희석 범위에서 유인 반응을 보였습니다. GC-MS로 에틸벤젠, 자일렌 등 후보 VOC를 찾아 화합물별 반응을 확인했고, odr-3 돌연변이에서 반응이 사라지거나 뒤집혀 ODR-3 의존 후각 경로가 관여함을 보였습니다.
      importance: 복잡한 VOC 프로파일을 살아있는 생물의 행동이라는 해석 가능한 신호로 바꾸고, 미세유체 칩으로 측정을 표준화했다는 점에서 비침습적 암 진단 연구의 새로운 접근을 제시합니다. 어린 시기 후각 각인이 성체 반응을 키운다는 결과는 감도 향상 전략으로도 활용될 수 있습니다. 현재는 세포 배양액 수준의 검증이며, 환자 유래 시료로의 확장은 후속 과제입니다.
    en:
      summary: A whole-organism microfluidic biosensing platform that uses C. elegans chemotaxis to detect volatile organic compounds (VOCs) released by lung cancer cells. The PDMS chip runs on standard NGM plates and standardizes paired comparisons between a reference and a test sample. Wild-type worms distinguished SK-MES-1 lung cancer-conditioned medium from non-malignant fibroblast medium and plain medium, with attraction over a 10⁻³ to 10⁻⁷ dilution range. GC-MS identified candidate VOCs such as ethylbenzene and xylenes, individual compounds produced attraction or avoidance responses, and odr-3 mutants lost or reversed the response, implicating ODR-3-dependent olfactory signaling.
      importance: The work turns complex VOC profiles into an interpretable, living readout and standardizes it on a chip, offering a new route toward non-invasive cancer detection. Early-life olfactory imprinting amplified adult responses, suggesting a way to boost sensitivity. Validation so far uses cell-conditioned media; patient-derived samples are the next step.
- num: 21
  title: 'Light-On and Power-On: A Dual Mode Active De-/Anti-Icing System Using Liquid Metal-Based Photothermal and Electrothermal Pastes'
  authors: Chimin Song, Soonchul Kwon, Jungmin Lee, Yongmin Cho, Joohyung Lee
  venue: J. Mater. Chem. A
  year: 2026
  detail: 14(22), 13363-13375
  url: https://doi.org/10.1039/d5ta10376b
  insight:
    ko:
      summary: 갈륨 기반 액체금속의 광열·전열 특성을 결합한 이중 모드 제빙·방빙 시스템을 제안했습니다. 광열 페이스트는 미립화된 액체금속 액적을 상전이물질(PCM)과 복합화해 햇빛을 열로 바꾸면서 잠열로 표면 온도를 스스로 조절하고, 전열 페이스트는 액체금속의 연속성을 유지하면서 실리콘 필러로 전기·열 특성을 조절해 인쇄 가능한 줄(Joule) 가열을 구현합니다. 두 페이스트 모두 점탄성이 있어 다양한 기재에 직접 바를 수 있습니다.
      importance: 햇빛이 있을 때는 광열, 흐리거나 밤에는 전열로 전환하는 구성으로 모의 겨울 조건에서 빠른 표면 가열과 결빙 방지를 에너지 효율적으로 달성했습니다. 교통, 항공, 건물, 산업 설비 등 결빙이 문제되는 분야에 바로 바를 수 있는 실용적 해법이라는 점이 특징이며, 실제 야외 장기 내구성 평가는 후속 과제입니다. Journal of Materials Chemistry A의 HOT Paper로 선정되었습니다.
    en:
      summary: A dual-mode de-/anti-icing platform combining the photothermal and electrothermal functions of gallium-based liquid metals. The photothermal paste hybridizes micronized liquid-metal droplets with a phase-change material so it converts sunlight into heat while self-regulating surface temperature through latent heat; the electrothermal paste keeps the liquid metal continuous and uses Si fillers for printable Joule heating with tunable properties. Both are viscoelastic pastes that can be applied directly to many substrates.
      importance: Used together, the system gave rapid surface heating and prevented ice formation under simulated winter conditions including overcast and nighttime scenarios, with good energy efficiency. It offers a practical, paint-on solution for transportation, aviation, buildings and industrial equipment; long-term outdoor durability remains to be tested. The paper was selected as a Journal of Materials Chemistry A HOT Paper.
- num: 20
  title: Efficient cell lysis and PCR platform with induction heating for C. elegans gene analysis
  authors: Seaan Hong, Jungyoon Uh, Minsu Kang, Taejin Kim, Youngeun Kwon, Yongmin Cho†, Hyun Ho Lee†
  venue: Adv. Ind. Eng. Chem.
  year: 2025
  detail: 1(33)
  url: https://link.springer.com/article/10.1007/s44405-025-00032-x
  insight:
    ko:
      summary: 유도가열(induction heating)을 이용해 낮은 전압과 전력으로 세포 용해와 PCR을 수행하는 플랫폼을 개발했습니다. 1차 코일, 시료 속 2차 코일, 튜브 아래 금속 링이 만드는 교류 자기장의 와전류로 시료를 부피 전체에서 가열하며, 12 V 입력과 25 W 미만의 전력으로 95/60/72 °C 열순환을 40회 안정적으로 유지했습니다. 예쁜꼬마선충 gDNA를 대상으로 act-1 유전자의 133 bp와 1875 bp 절편 증폭을 확인했습니다.
      importance: 기존 소형 PCR 장치가 겪는 균일 가열과 소비전력 문제를 단순한 유도가열 구조로 풀어, 현장형(field-deployable) 유전자 진단 장치로 발전할 가능성을 보였습니다. 포유류 세포나 미생물 gDNA로의 확장과 온도 제어 최적화는 후속 연구로 남겨 두었습니다.
    en:
      summary: A cell-lysis and PCR platform driven by induction heating that needs little power and a low operating voltage. A primary coil, a secondary coil inside the reaction mix and a metal ring under the tube create an alternating magnetic field whose eddy currents heat the sample volumetrically; thermal cycling at 95/60/72 °C ran for 40 cycles at 12 V and under 25 W. Using C. elegans genomic DNA, the system amplified 133 bp and 1875 bp segments of the act-1 gene.
      importance: It tackles the uneven heating and power demands that limit miniaturized PCR devices with a simple inductive design, pointing toward field-deployable genetic diagnostics. Extending to mammalian and microbial DNA and refining thermal control are left for future work.
- num: 19
  title: Advanced Neural Functional Imaging in C. elegans Using Lab-on-a-Chip Technology
  authors: Youngeun Kwon, Jihye Kim, Ye Bin Son , Sol Ah Lee, Shin Sik Choi, and Yongmin Cho
  venue: Micromachines
  year: 2024
  detail: 15(8), 1027
  url: https://www.mdpi.com/2072-666X/15/8/1027
  insight:
    ko:
      summary: 예쁜꼬마선충의 신경 기능 이미징 기법을 정리한 리뷰입니다. 칼슘 이미징 기술과 랩온어칩(미세유체) 기술을 중심으로, 화학·기계·온도·빛·자기 감각 등 다양한 감각 양식 연구에 이 기법들이 어떻게 적용되는지 살폈습니다.
      importance: 신경 회로가 완전히 지도화되어 있고 몸이 투명한 선충은 동물이 외부 자극을 감지하고 처리하는 원리를 연구하기에 이상적인 모델입니다. 이 리뷰는 정밀성과 재현성, 실시간 관찰이라는 관점에서 각 기법의 장점을 비교해, 신경 활동과 연결성의 기본 원리를 연구하려는 이들에게 출발점이 됩니다. 연구실 대학원생들이 주도해 작성했습니다.
    en:
      summary: A review of neural functional imaging in C. elegans, focusing on calcium imaging and lab-on-a-chip (microfluidic) technologies and how they are applied to chemosensation, mechanosensation, thermosensation, photosensation and magnetosensation.
      importance: With a fully mapped nervous system, transparent body and genetic tractability, C. elegans is an ideal model for asking how animals sense and process external cues. The review compares these methods in terms of precision, reproducibility and the ability to follow dynamic neural processes in real time, serving as an entry point for anyone studying neural activity and connectivity. It was written mainly by graduate students in the lab.
- num: 18
  title: Pickering-type Phase Change Capsules for Skin-temperature-controllable Sunscreen Formulation
  authors: Jiyoon Park, Yeongyeong Kim, Hyunji Lee, Chimin Song, Seongeun Kang, Yongmin Cho† , and Joohyung Lee†
  venue: Polymer(Korea)
  year: 2024
  detail: 48, 282-288
  url: http://journal.polymer-korea.or.kr/journal/download/pdf/4447
  insight:
    ko:
      summary: 자외선 차단제가 햇빛과 상호작용하며 발생하는 열을 잠열로 흡수해, 바른 부위에 열적 관성을 부여하는 유무기 복합 선스크린 조성물을 제조했습니다. 체온 근처(36~38 °C)에서 상전이하는 아이코산을 미립화해 넣었고, 별도 계면활성제 없이 자외선 차단제(UVF) 나노입자가 유체 계면에 자기조립하는 현상으로 코어-쉘·픽커링 구조의 PCM-UVF 하이브리드를 구현했습니다.
      importance: 생체 외 시험에서 일정 수준 이상의 SPF를 유지하면서도 햇빛 아래 표면 온도 상승을 유의미하게 지연시켰습니다. 자외선 차단과 온도 조절을 한 재료로 해결하는 접근으로, 화장품 제형에 상전이 물질을 적용하는 응용 가능성을 보여 줍니다.
    en:
      summary: An organic–inorganic hybrid sunscreen formulation that absorbs, as latent heat, the heat generated when UV filters interact with sunlight, giving the coated skin thermal inertia. Micronized eicosane, a phase-change material that melts near body temperature (36–38 °C), was stabilized without surfactants by the self-assembly of UV-filter nanoparticles at the fluid interface, producing core–shell or Pickering-type PCM–UV-filter hybrids.
      importance: In vitro, the formulation kept a meaningful SPF while significantly delaying the surface temperature rise under simulated sunlight. It shows how a single material can combine UV protection with temperature regulation, and how phase-change materials can be brought into cosmetic formulations.
- num: 17
  title: Dynamic temperature control in microfluidics for in vivo imaging of cold-sensing in C. elegans
  authors: Sol Ah Lee*, Yongmin Cho*, William R Schafer, Hang Lu (*Equal contribution)
  venue: Biophysical Journal
  year: 2024
  detail: 123 (8), 947
  url: https://www.cell.com/biophysj/abstract/S0006-3495%2824%2900172-3
  insight:
    ko:
      summary: 온도가 서로 다른 유체 흐름을 빠르게 전환해 예쁜꼬마선충에게 시간에 따라 변하는 온도 자극, 특히 만들기 어려웠던 빠른 냉각 자극을 주면서 신경 활동을 생체 내 이미징하는 미세유체 플랫폼을 개발했습니다. 전산 모델로 설계와 실험 조건을 최적화했고, 다기능 통각 뉴런 PVD의 기존 보고된 반응을 재현한 뒤 PVC 인터뉴런의 활동 기록으로 회로 분석 가능성을 보였습니다. 두 뉴런 모두 감작(sensitization) 특성을 보였습니다.
      importance: 선충의 온도 감각 행동은 잘 연구되었지만, 신경계가 온도를 어떻게 감지하는지는 빠른 온도 변화를 만들기 어려워 잘 알려지지 않았습니다. 이 플랫폼은 그 기술적 병목을 풀어, 냉각 감각의 분자·세포 기전 연구를 가속할 기반을 제공합니다.
    en:
      summary: A microfluidic platform that delivers well-controlled, temporally varying temperature stimuli, including the hard-to-produce rapid cold stimuli, to C. elegans by quickly switching fluid streams at different temperatures while imaging neuronal activity in vivo. Computational models guided the design and experimental conditions. The system recapitulated reported responses of PVD polymodal nociceptors and recorded activity in PVC interneurons as an example of circuit dissection; both neuron types showed sensitization.
      importance: Thermosensory behavior in C. elegans is well studied, but how the nervous system senses temperature has been limited by the difficulty of creating fast temperature changes. By removing that bottleneck, the platform enables studies of the molecular and cellular mechanisms of cold sensing.
- num: 16
  title: Trends in Single-Molecule Total Internal Reflection Fluorescence Imaging and Their Biological Applications with Lab-on-a-Chip Technology
  authors: Louis Colson, Youngeun Kwon, Soobin Nam, Avinashi Bhandari, Nolberto Martinez Maya, Ying Lu, and Yongmin Cho
  venue: Sensors
  year: 2023
  detail: 23 (18), 7691
  url: https://www.mdpi.com/1424-8220/23/18/7691
  note: featured as the front cover
  insight:
    ko:
      summary: 형광 기반 단일분자 이미징, 특히 널리 쓰이는 전반사 형광(TIRF) 현미경을 이용한 시험관 내 단일분자 이미징의 최신 동향을 정리한 리뷰입니다. 시료 준비와 표면 패시베이션, 데이터 수집·분석, 생물학적 응용을 체계적으로 다루고, 미세유체 기술과의 결합이 주는 이점과 과제를 논의했습니다.
      importance: 단일분자 수준에서 생체분자의 평형·동적 특성을 정량적으로 보는 기술의 입문서이자 현황 보고서 역할을 합니다. 미세유체와의 결합 가능성을 짚어 랩온어칩 연구자에게 유용하며, Sensors 표지 논문으로 선정되었습니다.
    en:
      summary: A review of fluorescence-based single-molecule imaging, centered on in vitro single-molecule measurements with the widely accessible total internal reflection fluorescence (TIRF) microscope. It covers sample preparation, surface passivation, data collection and analysis, and biological applications, and discusses the benefits and challenges of combining these techniques with microfluidics.
      importance: It serves as both a primer and a status report on quantifying the equilibrium and dynamic properties of biomolecules one molecule at a time, with particular attention to lab-on-a-chip integration. The article was featured as the journal's front cover.
- num: 15
  title: 'Inverse Lansing effect: maternal age and provisioning affecting daughters’ longevity and male offspring production'
  authors: C. E. Anderson, M. C. Malek, R. A. Jonas-Closs, Y. Cho, L. Peshkin, M. W. Kirschner, and L. Y. Yampolsky
  venue: American Naturalist
  year: 2022
  detail: 200 (5), 704-721
  url: https://www.journals.uchicago.edu/doi/10.1086/721148
  insight:
    ko:
      summary: 어미 나이가 많을수록 자손의 수명이 짧아진다는 '랜싱 효과'를 물벼룩(Daphnia magna) 여러 클론에서 검증한 결과, 효과의 크기와 방향이 클론마다 달랐고 일부 클론에서는 오히려 늙은 어미의 딸이 더 오래 사는 '역(逆)랜싱 효과'가 나타났습니다. 딸이 수컷 자손을 낳는 경향도 어미 나이에 따라 유전형별로 양방향으로 달라졌습니다. 대조적인 두 클론을 분석해 어미 나이에 따른 배아 지질 공급 차이가 이 효과를 설명함을 보였고, 역랜싱 클론에서는 늙은 어미의 새끼가 신경 조직의 미토콘드리아 막전위가 더 높았습니다.
      importance: 랜싱 효과가 보편적이지 않으며 유전형에 따라 뒤집힐 수 있음을 실험으로 보여 준 연구입니다. 늙은 어미의 지질 공급 변화가 배아기에 일종의 칼로리 제한 환경을 만들어 번식력은 줄고 수명은 늘어난다는 가설을 제시해, 모성 효과와 노화의 연결 고리를 새롭게 조명합니다.
    en:
      summary: Testing the Lansing effect, in which offspring of older mothers live shorter lives, across several Daphnia magna clones revealed clone-specific magnitude and direction of the maternal-age effect, including an inverse Lansing effect in which daughters of older mothers lived longer. Maternal age also shifted daughters' propensity to produce male offspring in a genotype-specific, bidirectional way. In two clones with contrasting life histories the effects were explained by how mothers of different ages provision embryos with lipids; in the inverse-Lansing clone, neonates of older mothers had higher mitochondrial membrane potential in neural tissue.
      importance: The study shows that the Lansing effect is not universal and can reverse depending on genotype. It proposes that age-specific maternal lipid provisioning creates a calorically restricted embryonic environment that lowers fecundity and extends lifespan, linking maternal effects to aging in a new way.
- num: 14
  title: Rapamycin treatment during development extends lifespan and healthspan of male mice and Daphnia manga
  authors: A. V. Shindyapina, Y. Cho, A. Kaya, A. Tyshkovskiy, J.P. Castro, A. Deik, J. Gordevicius, J. R. Poganik, C. B. Clish, S. Horvath, L. Peshkin, V. N. Gladyshev
  venue: Science Advances
  year: 2022
  detail: 8 (37), eabo5482
  url: https://www.science.org/doi/10.1126/sciadv.abo5482
  insight:
    ko:
      summary: 유전적으로 다양한 UM-HET3 생쥐에게 생후 45일 동안만 라파마이신을 투여했더니, 생쥐는 더 천천히 자라 평생 작은 체구를 유지했고 번식 시기가 늦어졌지만 새끼 수는 줄지 않았습니다. 이 짧은 처리만으로 중앙 수명이 10% 늘었고(수컷에서 가장 뚜렷), 노쇠 지수·보행 속도·포도당 및 인슐린 내성 검사로 본 건강도 더 잘 유지되었습니다. 처리 직후 간의 전사체와 후성유전체는 더 '젊은' 상태였습니다. 물벼룩(Daphnia magna)에서도 발달기 라파마이신 노출이 수명을 크게 늘리고 몸 크기를 줄였습니다.
      importance: 발달 단계를 약물로 늦추는 것이 수명 연장으로 이어진다는 것을 포유류와 무척추동물 모두에서 보인 연구로, 노화 개입이 생애 초기부터 가능함을 시사합니다. 우리 연구실의 물벼룩 고속 표현형 분석 플랫폼이 종을 넘는 검증에 활용되었습니다.
    en:
      summary: Genetically diverse UM-HET3 mice were given rapamycin only for the first 45 days of life. They grew more slowly and stayed smaller for life, and their reproductive age was delayed without reducing offspring numbers. This brief treatment extended median lifespan by 10%, most strongly in males, and preserved health as measured by frailty index, gait speed and glucose and insulin tolerance; at the end of treatment the liver transcriptome and epigenome looked younger. Developmental rapamycin exposure likewise robustly extended the lifespan of Daphnia magna and reduced its body size.
      importance: The work shows in both a mammal and an invertebrate that pharmacologically slowing development can extend life, suggesting that aging can be targeted early in life. The lab's high-throughput Daphnia phenotyping platform provided the cross-species validation.
- num: 13
  title: Intelligent high-throughput intervention testing platform in Daphnia
  authors: Y.Cho, R. A. Jonas-Closs, Lev. Y. Yampolsky, M. W. Kirschner, and L. Peshkin
  venue: Aging Cell
  year: 2022
  detail: . 21 (3), e13571
  url: https://onlinelibrary.wiley.com/doi/full/10.1111/acel.13571
  insight:
    ko:
      summary: 수명이 짧으면서도 복잡한 행동과 생리를 가진 물벼룩(Daphnia magna)에서 약물 등 개입의 효과를 수명과 건강수명 관점에서 시험하는 플랫폼을 개발했습니다. 동기화된 대규모 집단의 일상 움직임과 자극 반응에서 수십 가지 행동 특징을 자동 표현형 분석 파이프라인으로 연속 정량하고, 실제 나이로 보정한 기계학습 모델로 '표현형 나이'를 추정합니다. 메트포르민의 장기 용량-반응 프로파일과 카페인·알코올의 단기 분석으로 활용 예를 보였습니다.
      importance: 생애 전체에 걸친 장기 분석과 수 시간 단위의 즉시 분석을 모두 지원하는 확장 가능한 약물 스크리닝 틀을 제시합니다. 영상 기반 행동 데이터와 기계학습을 결합해 노화를 정량화하는 우리 연구실 접근법의 출발점이 된 논문입니다.
    en:
      summary: A platform for testing how interventions affect lifespan and healthspan in Daphnia magna, a short-lived freshwater crustacean with complex behavior and physiology. Dozens of behavioral features from routine motion and responses to stimuli are quantified continuously across large synchronized cohorts by an automated phenotyping pipeline, and machine-learning models calibrated on chronological age estimate phenotypic age, including under pharmacological perturbation. Use cases include a long-term dose–response profile of metformin and short-term assays of caffeine and alcohol.
      importance: It provides a scalable framework for drug screening and characterization in both lifelong and instant assays. The paper is the foundation of the lab's approach of combining image-based behavioral data with machine learning to quantify aging.
- num: 12
  title: Lack of Age-related Respiratory Changes in Daphnia
  authors: C. E. Anderson, M. N. Ekwudo, R. A. Jonas-Closs, Y. Cho, L. M. Peshkin, M. W. Kirschner, and L. Y. Yampolsky
  venue: Biogerontology
  year: 2022
  detail: 23 (1), 85-97
  url: https://link.springer.com/article/10.1007/s10522-021-09947-6
  insight:
    ko:
      summary: 물벼룩(Daphnia magna) 4개 유전형에서 나이에 따른 호흡률, 젖산/피루브산 비(NADH/NAD⁺ 균형의 지표), 미토콘드리아 막전위의 변화를 조사했습니다. 체중 보정 호흡률은 나이 들수록 조금 줄었지만 이는 이동과 섭식 활동 감소로 모두 설명되었고, 단백질량으로 보정한 호흡이나 마취 상태의 기초 호흡률은 줄지 않았습니다. 젖산/피루브산 비와 미토콘드리아 막전위도 대체로 변화가 없었으며, 가스교환 기관인 부속지 등 일부 기관에서만 예외가 보였습니다.
      importance: 선충, 초파리, 포유류에서 보고된 '노화에 따른 호흡 기능 저하'가 물벼룩에서는 나타나지 않음을 보여, 물벼룩의 사망률 증가가 호흡 대사 감퇴 때문이 아님을 시사합니다. 평생 미토콘드리아 건강을 유지하는 기전을 탐구할 새로운 모델로서 물벼룩의 가치를 부각합니다.
    en:
      summary: Age-related changes in respiration rate, lactate/pyruvate ratio (a proxy for NADH/NAD⁺ balance) and mitochondrial membrane potential were examined in four genotypes of Daphnia magna. Body-weight-adjusted respiration declined slightly with age, but this was fully accounted for by reduced locomotion and feeding; respiration normalized by protein content and basal respiration in anesthetized animals did not decline. Lactate/pyruvate ratio and membrane potential showed no age-related change except in a few organs such as the gas-exchange epipodites.
      importance: Unlike nematodes, flies and mammals, Daphnia shows no age-related decline in respiratory metabolism, so its actuarial senescence must arise elsewhere. This positions Daphnia as a model for studying how mitochondrial healthspan can be maintained throughout life.
- num: 11
  title: Development of a novel fluorescent biosensor for dynamic monitoring of metabolic methionine redox status in cells and tissues
  authors: D. W. Choi, Y. J. Roh, S. Kim, H. M. Lee, M. Kim, D. Shin, J. H. Park, Y. Cho, H. H. Park, Y. S. Ok, D. Kang, J. H. Kim, L. Tarrago, N. N. Danial, V. N. Gladyshev, P. K. Min, B. C. Lee
  venue: Biosensors and Bioelectronics
  year: 2021
  detail: 178, 113031
  url: https://www.sciencedirect.com/science/article/pii/S0956566321000671
  insight:
    ko:
      summary: 활성산소종(ROS)은 불안정해 직접 정량하기 어렵습니다. 이 연구는 ROS와 메티오닌 산화환원 상태의 새로운 지표인 유리 메티오닌-R-설폭사이드(fMetRO)를 높은 특이성과 감도로 검출하는 유전자 암호화 형광 바이오센서 TYfR(Trx1-cpYFP-fRMsr)를 개발해, 세포와 조직에서 생리적 수준의 fMetRO를 실시간 정량했습니다. 급성관상동맥증후군 환자 혈청에서 fMetRO가 유의하게 높았고, 관상동맥 중재술 후 더 뚜렷해지는 것도 확인했습니다.
      importance: fMetRO를 ROS 관련 조직 손상 축적의 새로운 바이오마커로 제안하고, 이를 측정할 실용적 도구를 제공합니다. 심혈관 질환을 비롯한 산화 스트레스 관련 질환 연구와 진단에 응용될 수 있습니다.
    en:
      summary: Reactive oxygen species are hard to quantify directly because they are unstable. This study developed TYfR (Trx1-cpYFP-fRMsr), a genetically encoded fluorescent biosensor with high specificity and sensitivity for free methionine-R-sulfoxide (fMetRO), a new indicator of ROS and methionine redox status, enabling dynamic quantification of physiological fMetRO levels in cells and tissues. Serum fMetRO was significantly elevated in patients with acute coronary syndrome and rose further after percutaneous coronary intervention.
      importance: The work proposes fMetRO as a biomarker of tissue damage accumulation in ROS-associated pathologies and provides a practical tool to measure it, with potential applications in cardiovascular and other oxidative-stress-related diseases.
- num: 10
  title: An automated platform to monitor long-term behavior and healthspan in C. elegans under precise environmental control
  authors: K. N. Le*, M. Zhan*, Y. Cho*, J. Wan, D. S. Patel, and H. Lu (*Equal contribution)
  venue: Communications Biology
  year: 2020
  detail: 3 (1), 297
  url: https://www.nature.com/articles/s42003-020-1013-2
  insight:
    ko:
      summary: 환경 조건을 평생 동안 정밀하게 제어하면서 예쁜꼬마선충 개체의 행동을 장기간 추적하는 자동화 미세유체 시스템 HeALTH(Health and Lifespan Testing Hub)를 개발했습니다. 기존 수명·건강수명 분석의 한계를 넘어 유전적·환경적 섭동 아래에서 대규모 종단 노화 연구를 수행했고, 같은 조건에서도 개체마다 노화 경로가 다른 '개체성'이 어떻게 드러나는지 관찰했습니다.
      importance: 환경, 유전, 확률적 요인이 노화에 어떻게 상호작용하는지 보려면 장기간 정밀한 환경 제어가 필수인데, 이 시스템이 그 기반을 제공합니다. 노화 연구를 넘어 단기·장기 행동 분석 전반에 쓸 수 있고 다른 모델 생물로도 확장 가능합니다.
    en:
      summary: HeALTH (Health and Lifespan Testing Hub) is an automated microfluidic system for robust longitudinal behavioral monitoring of individual C. elegans with precise spatiotemporal environmental control over the entire lifespan. Overcoming the limits of existing healthspan and lifespan assays, it enabled large-scale aging studies under genetic and environmental perturbations and revealed how individuality shapes the aging process.
      importance: Understanding how environmental, genetic and stochastic factors interact in aging requires long-term, precisely controlled conditions, which this system provides. It generalizes beyond aging to short- and long-term behavioral assays and can be adapted to other model organisms.
- num: 9
  title: Multimodal Stimulation in a Microfluidic Device Facilitates Studies of Interneurons in Sensory Integration in C. elegans
  authors: Y. Cho*, S. A. Lee*, Y. L. Chew, K. Broderick, W. R. Schafer, and H. Lu (*Equal contribution)
  venue: Small
  year: 2020
  detail: 16 (10), 1905852
  url: https://onlinelibrary.wiley.com/doi/full/10.1002/smll.201905852
  note: featured as the front cover
  cover: /images/publications/cover-9.jpg
  insight:
    ko:
      summary: 공간·시간·세기를 제어한 기계 자극과 화학 자극을 예쁜꼬마선충에게 동시에 또는 순차적으로 줄 수 있는 미세유체 플랫폼을 개발해, 감각 뉴런과 인터뉴런의 활동을 정량적이고 고속으로 측정했습니다. 명령 인터뉴런 PVC의 활동이 같은 양식이든 다른 양식이든 앞선 자극에 의해 조절됨을 발견했고, 모노아민과 신경펩타이드 신호가 이 다중감각 통합에 어떤 역할을 하는지 분석했습니다.
      importance: 동물의 지각과 행동은 여러 감각의 통합에서 나오지만, 기존 선충 기능 이미징은 기술적 한계로 단일 자극 연구에 머물렀습니다. 이 플랫폼은 그 장벽을 낮춰 다중감각 통합의 기전과 관련 유전자를 찾는 연구에 널리 적용될 수 있습니다. Small 표지 논문으로 선정되었습니다.
    en:
      summary: A microfluidic platform that delivers spatially and temporally controlled combinations of mechanical and chemical stimuli to C. elegans, enabling quantitative, high-throughput measurement of both sensory and interneuron activity. The command interneuron PVC was found to be modulated by prior stimulation within and across modalities, and the roles of monoaminergic and peptidergic signaling in this multimodal integration were examined.
      importance: Perception and behavior arise from integrating multiple senses, yet functional imaging in C. elegans had largely been limited to single-modality stimuli because controlled multimodal experiments were technically difficult. The approach is broadly applicable for dissecting mechanisms and identifying genes involved in multisensory integration. The paper was featured on the cover of Small.
- num: 8
  title: An Afferent Neuropeptide System Transmits Mechanosensory Signals Triggering Sensitization and Arousal in C. elegans
  authors: Y. L. Chew, Y. Tanizawa, Y. Cho, B. Zhao, A. J. Yu, S. Ahn, C. Rankin, Y. J. You, H. Lu, I. Beets, and W. R. Schafer
  venue: Neuron
  year: 2018
  detail: 99 (6), 1233-1246. e6
  url: https://www.sciencedirect.com/science/article/pii/S0896627318306767
  insight:
    ko:
      summary: 예쁜꼬마선충에서 혐오적 기계 자극이 운동 활성을 높이고(각성) 혐오 화학감각 경로까지 민감하게 만드는(교차 양식 감작) 현상의 분자·신경 기전을 밝혔습니다. 두 반응 모두 1차 기계감각 뉴런에서 분비되는 FLP-20 신경펩타이드와 그 수용체 FRPR-3에 의존하며, 놀랍게도 FRPR-3의 핵심 작용 부위는 신경펩타이드 분비에 특화된 단일 신경내분비 세포 RID였습니다.
      importance: 감작은 위험 신호 뒤에 반응성이 높아지는 가장 단순한 행동 가소성이지만 그 기전은 잘 몰랐습니다. 이 연구는 FLP-20 펩타이드가 기계감각 정보를 중추로 전달해 각성 상태를 조절하는 '구심성 각성 신호'임을 보여, 신경펩타이드가 행동 상태를 바꾸는 방식의 구체적 사례를 제공합니다.
    en:
      summary: The study uncovered the molecular and neural basis of how aversive mechanical stimuli in C. elegans both raise locomotor activity (arousal) and sensitize aversive chemosensory pathways (cross-modal sensitization). Both depend on FLP-20 neuropeptides released from primary mechanosensory neurons and their receptor FRPR-3, and surprisingly the critical site of FRPR-3 action is RID, a single neuroendocrine cell specialized for neuropeptide release.
      importance: Sensitization is one of the simplest forms of behavioral plasticity, yet its mechanisms were poorly understood. The work shows that FLP-20 peptides act as an afferent arousal signal carrying mechanosensory information to central neurons that set behavioral state, a concrete example of how neuropeptides reshape behavior.
- num: 7
  title: On-chip functional neuroimaging to mechanical stimulation in Caenorhabditis elegans larvae for studying functional role of neural circuits
  authors: Y. Cho, D. N. Oakland, S. A. Lee, W. R. Schafer, and H. Lu
  venue: Lab on a chip
  year: 2018
  detail: 18, 601-609
  url: https://pubs.rsc.org/en/content/articlelanding/2018/lc/c7lc01201b
  insight:
    ko:
      summary: 성체보다 훨씬 작은 예쁜꼬마선충 유충에게 정량적으로 제어된 기계 자극을 주면서 신경 활동을 생체 내 이미징할 수 있는 자동 미세유체 플랫폼 시리즈를 개발했습니다. 새로운 제작법으로 매우 유연한 공압 구동 온칩 구조를 만들어 구동 압력만 바꿔 약한 접촉과 강한 접촉 뉴런을 모두 자극할 수 있게 했으며, 초기 유충에서도 두 종류의 접촉 뉴런이 성체와 비슷하게 작동함을 보였습니다. 수면 유사 상태(lethargus)에서의 신경 반응 변화도 조사했습니다.
      importance: 발달 과정의 감각 생물학은 유충을 다루기 어려워 공백으로 남아 있었습니다. 이 플랫폼은 그 병목을 해결해 기계감각 뉴런과 회로의 발달 연구를 가능하게 했고, 설계가 단순해 다른 연구실로 쉽게 이전할 수 있습니다.
    en:
      summary: A series of automated microfluidic platforms for in vivo functional imaging of C. elegans larvae, which are far smaller than adults, under quantitatively controlled mechanical stimulation. A new fabrication method produced highly deformable pneumatically actuated on-chip structures that stimulate gentle- or harsh-touch neurons simply by changing actuation pressure. Gentle and harsh touch neurons were shown to function in early larvae much as they do in adults, and responses during the sleep-like lethargus state were examined.
      importance: Developmental aspects of sensory biology had been a gap because larvae are hard to assay. By removing that bottleneck, the platform enables studies of how mechanosensory neurons and circuits develop, and its simple design makes it easy to adopt in other labs.
- num: 6
  title: A programmable platform for sub-second multichemical dynamic stimulation and neuronal functional imaging in C. elegans
  authors: T. Rouse, G. Aubry, Y. Cho, M. Zimmer and H. Lu
  venue: Lab on a chip
  year: 2018
  detail: 18, 505-513
  url: https://pubs.rsc.org/en/content/articlelanding/2018/lc/c7lc01116d/unauth
  insight:
    ko:
      summary: 여러 화학 시약을 서로 섞이지 않게, 1초 미만의 시간 해상도로 임의의 순서로 전달할 수 있는 미세유체 플랫폼을 개발했습니다. 저장조에 가하는 압력 조합으로 자극 화학물질을 선택하는 선택기 네트워크를 설계하고 압력 조절을 자동화해 프로그램 가능한 초 단위·초 미만 화학 펄스 시퀀스를 구현했습니다. 서로 다른 화학물질의 순차 자극이 화학감각 뉴런에서 이전에 관찰되지 않은 활동 패턴을 만들어 냄을 보였습니다.
      importance: 화학감각 회로의 시간 동역학을 이해하려면 빠르고 정밀한 다중 자극이 필요하지만 기존 방법으로는 어려웠습니다. 이 플랫폼의 속도와 유연성은 신경 회로의 시간적 처리 방식을 탐구할 새로운 길을 엽니다.
    en:
      summary: A microfluidic platform that delivers any sequence of multiple chemical reagents at sub-second resolution without cross-contamination. A network of chemical selectors chooses the stimulus by the set of pressures applied to the reservoirs, and automated pressure modulation creates robust, programmable sequences of sub-second chemical pulses. Sequential stimulation with different chemicals at second to sub-second intervals produced previously unseen activity patterns in chemosensory neurons.
      importance: Characterizing the temporal dynamics of chemosensory circuits requires fast, precise delivery of multiple stimuli, which was hard with existing methods. The speed and versatility of this platform open new ways to probe how neural circuits process information over time.
- num: 5
  title: Automated and controlled mechanical stimulation and functional imaging in vivo in C. elegans
  authors: Y. Cho*, D. A. Porto*, H. Hwang, L. J. Grundy, W. R. Schafer, and H. Lu (*Equal contribution)
  venue: Lab on a chip
  year: 2017
  detail: 17, 2609-2618
  url: https://pubs.rsc.org/en/content/articlelanding/2017/lc/c7lc00465f
  insight:
    ko:
      summary: 예쁜꼬마선충 기계감각 연구는 접착제로 고정하고 손으로 자극을 주는 방식에 의존해 처리량이 낮고 변동이 컸습니다. 이 연구는 넓은 범위의 기계 자극을 정밀하고 재현성 있게 전달하면서 기능 이미징과 광학적 조작을 함께 할 수 있는 완전 자동 미세유체 플랫폼을 개발했습니다. 잘 알려진 약한·강한 접촉 뉴런의 반응과 수용 영역을 재현했고, 칼슘 동역학을 지표로 생체 내 약물 스크리닝이 가능함을 시연했습니다.
      importance: 기계감각 연구의 처리량과 재현성을 크게 높여, 기계감각과 다중감각 행동에 관여하는 유전자·분자, 나아가 관련 질환 치료제 발굴을 가속할 수 있는 도구입니다. 연구실 미세유체 기계 자극 플랫폼 계열의 첫 논문입니다.
    en:
      summary: Studies of mechanosensation in C. elegans had relied on gluing worms and delivering stimuli by hand, giving low throughput and high variability. This work presents a fully automated microfluidic platform that delivers a wide range of mechanical stimuli precisely and robustly while supporting functional imaging and optical interrogation. It recapitulated the responses and receptive fields of the well-known gentle- and harsh-touch neurons and demonstrated an in vivo drug screen using calcium dynamics as the readout.
      importance: By greatly raising throughput and reproducibility, the platform can accelerate the discovery of genes and molecules involved in mechanosensation and multimodal sensory behavior, as well as therapeutics for related diseases. It is the first in the lab's line of microfluidic mechanical-stimulation platforms.
- num: 4
  title: Trends in High-throughput and Functional Neuroimaging in C. elegans
  authors: Y. Cho, C. Zhao, and H. Lu
  venue: Wiley Interdisciplinary Reviews - Systems Biology and Medicine
  year: 2017
  detail: e01376
  url: https://wires.onlinelibrary.wiley.com/doi/full/10.1002/wsbm.1376
  insight:
    ko:
      summary: 예쁜꼬마선충 신경계의 고속·기능 이미징 동향을 정리한 리뷰입니다. 302개 뉴런의 발달이 모두 지도화되어 있고 몸이 투명해 유전자 암호화 칼슘 지시자로 신경 활동을 직접 볼 수 있는 선충의 장점을 소개하고, 벌레를 시야에 고정하고 영상을 빠르게 수집하며 데이터를 견고하게 분석해야 하는 실험적 과제와, 많은 개체나 뉴런을 동시에 이미징하는 최근 추세를 다룹니다.
      importance: 다른 생물에서는 불가능한 규모로 데이터를 얻게 해 주는 새로운 도구와 분석법이 선충 신경생물학, 나아가 신경과학 전반에 어떤 관점을 열어 주는지 조망합니다.
    en:
      summary: A review of trends in high-throughput and functional neuroimaging in C. elegans. It introduces the worm's advantages, with all 302 neurons mapped from zygote to adult and a transparent body that lets genetically encoded calcium indicators report neuronal activity directly, and discusses the experimental challenges of holding worms in view, collecting images rapidly and analyzing the data robustly, together with the recent trend toward imaging many worms or neurons at once.
      importance: It surveys how new tools, techniques and analytic approaches that acquire data at a scale impossible in other organisms open new perspectives on C. elegans neurobiology and on neuroscience more broadly.
- num: 3
  title: An Insulin-to-Insulin Regulatory Network Orchestrates Phenotypic Specificity in Development and Physiology
  authors: D. A. F. de Abreu, A. Caballero, P. Fardel, N. Stroustrup, Z. Chen, K. Lee, W. D. Keyes, Z. M. Nash, I. F. Lo´ pez-Moyado, F. Vaggi, A. Cornils, M. Regenass, A. Neagu, I. Ostojic, C. Liu, Y. Cho, D. Sifoglu, Y. Shen, W. Fontana, H. Lu, A. Csikasz-Nagy, C. T. Murphy, A. Antebi, E. Blanc, J. Apfeld, Y. Zhang, J. Alcedo, Q. Ch’ng
  venue: PLOS Genetics
  year: 2014
  detail: 10(3), e1004225
  url: https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.1004225
  insight:
    ko:
      summary: 예쁜꼬마선충의 40가지 인슐린 유사 펩타이드(ILP)가 발달, 생식, 수명, 여러 스트레스 반응을 어떻게 조율하는지 체계적으로 분석했습니다. ILP들은 전반적으로 중복되기보다 기능이 특이하고 다양하며, 서로의 전사를 조절하는 'ILP 간 조절 네트워크'를 이룬다는 것을 발견했습니다. 광범위한 유전적 상호작용 분석으로 신호가 통합되는 방식과, 병렬로 작동하며 교차·되먹임·보상으로 상호작용하는 국소 유전 회로를 밝혔습니다.
      importance: 대부분의 동물 유전체가 여러 ILP를 갖는데, 이 연구는 그 조합이 어떻게 표현형 특이성과 단계적 조절을 만들어 내는지 보여 주는 모델을 제시합니다. 거대한 호르몬 네트워크가 다양한 형질을 조절하는 원리에 대한 통찰을 줍니다.
    en:
      summary: A systematic analysis of how the forty insulin-like peptides (ILPs) of C. elegans coordinate development, reproduction, longevity and specific stress responses. The ILPs form a combinatorial code marked by functional specificity and diversity rather than global redundancy, and they regulate each other transcriptionally, forming an ILP-to-ILP regulatory network. Extensive genetic-interaction analyses revealed how their signals are integrated through local circuits that act in parallel and interact by crosstalk, feedback and compensation.
      importance: Most animal genomes encode multiple ILPs; this work provides a model for how such a family produces phenotypic specificity and graded regulation, with implications for how large hormonal networks control diverse traits.
- num: 2
  title: pH-Responsive Assembly of Gold Nanoparticles and “Spatiotemporally Concerted” Drug Release for Synergistic Cancer Therapy
  authors: J. Nam, W. La, S. Hwang, Y. S. Ha, N. Park, N. Won, S. Jung, S. H. Bhang, Y. Ma, Y. Cho, M. Jin, J. Han, J. Shin, E. KyungWang, S. G. Kim, S. Cho, J. Yoo, B. Kim, S. Kim
  venue: ACS Nano
  year: 2013
  detail: 7 (4), 3388 – 3402
  url: https://pubs.acs.org/doi/10.1021/nn400223a
  insight:
    ko:
      summary: 광열 치료용 플라스몬 나노구조는 보통 100 nm 안팎으로 커서 약물과 체내 분포가 달라지는 문제가 있었습니다. 이 연구는 10 nm의 pH 반응성 금 나노입자에 독소루비신을 결합해, 종양처럼 약산성인 환경에서 입자가 응집해 광열제로 작동하는 동시에 약물이 방출되도록 설계했습니다. 이 '시공간적으로 일치된' 작용을 세포 내, 세포, 장기 수준에서 확인했고, 접합체는 종양에 대조군의 최대 17배까지 축적되며 세포 수준에서 약 한 자릿수 규모의 상승 효과를 보였습니다.
      importance: 유효 약물 용량과 광열 레이저 역치를 모두 크게 낮추면서 동물 모델에서 다른 장기 손상 없이 종양 성장을 억제해, 열-화학 병용 암 치료의 새로운 플랫폼을 제시했습니다.
    en:
      summary: Plasmonic nanostructures for photothermal therapy are typically about 100 nm, so their biodistribution differs from that of small drugs. This work conjugated doxorubicin to 10 nm pH-responsive gold nanoparticles designed to aggregate in the mildly acidic tumor environment, where the aggregates act as a photothermal agent while the drug is released at the same time and place. This spatiotemporal concertion was confirmed at subcellular, cellular and organ levels; the conjugates accumulated in tumors up to 17-fold over controls and showed a nearly order-of-magnitude synergistic effect in cells.
      importance: The platform markedly lowered both the effective drug dose and the photothermal laser threshold and suppressed tumor growth in an animal model without noticeable damage to other organs, offering a new approach to combined thermo-chemotherapy.
- num: 1
  title: Comparison between heparin-conjugated fibrin and collagen sponge as bone morphogenetic protein-2 carrier for bone regeneration
  authors: H. S. Yang*, W. La*, Y. Cho, W. Shin, G. Yeo, B. Kim (*Equal contribution)
  venue: Experimental and Molecular Medicine
  year: 2012
  detail: 44, 350-355
  url: https://www.nature.com/articles/emm201239
  insight:
    ko:
      summary: 골 재생 성장인자 BMP-2는 전달체에 따라 효과가 크게 달라집니다. 이 연구는 BMP-2를 장기간 방출하는 헤파린 결합 피브린(HCF)을 임상에서 쓰이는 콜라겐 스펀지와 비교했습니다. HCF는 BMP-2의 80%를 20일에 걸쳐 방출한 반면 콜라겐 스펀지는 6일 만에 같은 양을 방출했고, 생쥐 두개골 결손 모델에서 HCF는 콜라겐 스펀지의 절반 이하 용량으로 결손을 완전히 재생했으며 재생된 뼈의 밀도도 더 높았습니다.
      importance: 서방형 전달체가 BMP-2의 골 형성 효능을 높인다는 것을 임상 표준 전달체와 직접 비교해 보여, 성장인자 용량을 줄이면서 효과를 높이는 전달 전략의 근거를 제공합니다.
    en:
      summary: The bone-regenerating growth factor BMP-2 depends heavily on its delivery vehicle. This study compared heparin-conjugated fibrin (HCF), a long-term BMP-2 carrier, with the clinically used collagen sponge. HCF released 80% of loaded BMP-2 over 20 days versus 6 days for collagen sponge, and in mouse calvarial defects HCF achieved complete bone formation at less than half the BMP-2 dose required with collagen sponge, with higher bone density in the regenerated tissue.
      importance: By directly comparing against the clinical standard, the work shows that sustained delivery improves the osteogenic efficacy of BMP-2, supporting delivery strategies that lower growth-factor dose while improving outcomes.
